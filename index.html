<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Months — A Collection of Us</title>
<meta name="description" content="Six months, one London library of us.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1795539866">
</head>
<body>

<header class="bar">
  <a class="brand" href="#" id="brand">
    <svg class="roundel" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="none" stroke="#DC241F" stroke-width="5"/><rect x="2" y="16" width="36" height="8" fill="#0019A8"/></svg>
    <span id="brandText">SIX MONTHS</span>
  </a>
  <nav class="nav">
    <button data-go="library">[ LIBRARY ]</button>
    <button data-go="journey">[ THE JOURNEY ]</button>
    <button data-go="letter">[ A NOTE ]</button>
  </nav>
  <div class="clock" aria-label="London time">LONDON <span id="clock">--:--</span></div>
</header>

<main>
  <section class="library" id="library">
    <div class="sky" aria-hidden="true"></div>
    <div class="eyebrow">[ NEW &amp; FEATURED MEMORIES ]</div>

    <div class="since" id="since"></div>
    <div class="stage" id="stage" aria-label="Photo carousel"></div>

    <div class="caption" id="caption" aria-live="polite">
      <div class="cap-title" id="capTitle"></div>
      <div class="cap-meta" id="capMeta"></div>
      <button class="open" id="openBtn">OPEN PHOTO [+]</button>
    </div>

    <div class="counter" id="counter"></div>
    <div class="hint">DRAG · SCROLL · ← →</div>
  </section>

  <section class="journey" id="journey">
    <div class="eyebrow">[ THE JOURNEY SO FAR ]</div>
    <h2>Six stops. <em>Still going.</em></h2>
    <div class="line" id="line"></div>
  </section>

  <section class="letter" id="letter">
    <div class="eyebrow">[ ABOUT THIS EDITION ]</div>
    <p id="letterText"></p>
    <div class="sign" id="sign"></div>
  </section>

  <footer>
    <div id="footFrom"></div>
    <div>Printed in London, E1 · Edition of one</div>
    <div>MIND THE GAP BETWEEN NOW AND FOREVER</div>
  </footer>
</main>

<!-- Open photo -->
<div class="viewer" id="viewer" aria-hidden="true">
  <button class="close" id="close">[ ESC ] TO LIBRARY</button>
  <div class="spread">
    <figure class="page-photo" id="vPhoto"></figure>
    <div class="page-text">
      <div class="eyebrow" id="vPlace"></div>
      <h3 id="vTitle"></h3>
      <div class="rule"></div>
      <p id="vNote"></p>
      <dl>
        <div><dt>DATE</dt><dd id="vDate"></dd></div>
        <div><dt>PLATFORM</dt><dd id="vLine"></dd></div>
        <div><dt>ENTRY</dt><dd id="vIndex"></dd></div>
      </dl>
      <div class="vnav">
        <button id="prev">[ ← PREV ]</button>
        <button id="next">[ NEXT → ]</button>
      </div>
    </div>
  </div>
</div>

<script src="data.js?v=1795548031"></script>
<script src="script.js?v=1795539700"></script>
</body>
</html>
